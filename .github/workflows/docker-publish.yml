name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to apply (e.g. 0.2.2). Leave blank when triggered by a tag push."
        required: false
        default: ""

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails before any image is pushed when CHANGELOG.md has no section for the tag.
      - name: Check release notes
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists already."
          else
            node scripts/release-notes.mjs "$TAG" > /dev/null
          fi

      - name: Set up QEMU (multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: build-and-push
    # A tag push, or a dispatch on a tag (tag-release.yml). A dispatch on a branch has no tag to release.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # A second run for the same tag waits, then finds the release and skips.
    concurrency:
      group: release-${{ github.ref_name }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists already; leaving it as it is."
            exit 0
          fi

          VERSION="${TAG#v}"
          # Prereleases are left out: sort -V puts 1.2.0-rc.1 after 1.2.0.
          HIGHEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          LATEST=false
          [ "$TAG" = "$HIGHEST" ] && LATEST=true
          PRERELEASE=false
          case "$VERSION" in *-*) PRERELEASE=true ;; esac

          NOTES_ARGS=("$VERSION")
          [ "$LATEST" = true ] && NOTES_ARGS+=(--latest)
          node scripts/release-notes.mjs "${NOTES_ARGS[@]}" > release-notes.md

          gh release create "$TAG" --verify-tag --title "$VERSION" --notes-file release-notes.md \
            --latest="$LATEST" --prerelease="$PRERELEASE"
