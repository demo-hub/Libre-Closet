name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to apply (e.g. 0.2.2). Leave blank when triggered by a tag push."
        required: false
        default: ""

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      latest: ${{ steps.floating.outputs.latest }}
      tags: ${{ steps.floating.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The floating tags X.Y, X and latest move only when this tag is the highest stable
      # version in its minor, in its major, or overall. So v1.1.1 pushed after v1.2.0 gets
      # 1.1.1 and 1.1, and leaves 1 and latest on 1.2.0. A prerelease, or a dispatch on a
      # branch, gets none. There is no bare 0 tag. A tag runs the workflow file at its own
      # commit, so a backport branch cut from 1.2.0 or earlier needs this step cherry-picked.
      - name: Work out floating tags
        id: floating
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          # The highest stable tag starting with $1. TAG is added in case the fetch missed it.
          highest() {
            { git tag -l "$1*"; echo "$TAG"; } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1
          }
          MINOR=false MAJOR=false LATEST=false FLOATING=()
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            X="${BASH_REMATCH[1]}" Y="${BASH_REMATCH[2]}"
            if [ "$(highest "v$X.$Y.")" = "$TAG" ]; then MINOR=true; FLOATING+=("$X.$Y"); fi
            if [ "$X" != 0 ] && [ "$(highest "v$X.")" = "$TAG" ]; then MAJOR=true; FLOATING+=("$X"); fi
            if [ "$(highest v)" = "$TAG" ]; then LATEST=true; FLOATING+=(latest); fi
          fi
          echo "Floating tags for ${TAG:-this ref}: ${FLOATING[*]:-none}"
          {
            echo "minor=$MINOR"
            echo "major=$MAJOR"
            echo "latest=$LATEST"
            echo "tags=$(IFS=,; echo "${FLOATING[*]}")"
          } >> "$GITHUB_OUTPUT"

      # Fails before any image is pushed when CHANGELOG.md has no section for the tag.
      - name: Check release notes
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists already."
          else
            node scripts/release-notes.mjs "$TAG" > /dev/null
          fi

      - name: Set up QEMU (multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
          # Off, or every stable semver tag would also get latest.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.floating.outputs.minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.floating.outputs.major == 'true' }}
            type=raw,value=latest,enable=${{ steps.floating.outputs.latest == 'true' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: build-and-push
    # A tag push, or a dispatch on a tag (tag-release.yml). A dispatch on a branch has no tag to release.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # A second run for the same tag waits, then finds the release and skips.
    concurrency:
      group: release-${{ github.ref_name }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          # Worked out once, in build-and-push, so the release says what the image got.
          LATEST: ${{ needs.build-and-push.outputs.latest }}
          FLOATING_TAGS: ${{ needs.build-and-push.outputs.tags }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists already; leaving it as it is."
            exit 0
          fi

          VERSION="${TAG#v}"
          PRERELEASE=false
          case "$VERSION" in *-*) PRERELEASE=true ;; esac

          node scripts/release-notes.mjs "$VERSION" --tags="$FLOATING_TAGS" > release-notes.md

          gh release create "$TAG" --verify-tag --title "$VERSION" --notes-file release-notes.md \
            --latest="$LATEST" --prerelease="$PRERELEASE"
